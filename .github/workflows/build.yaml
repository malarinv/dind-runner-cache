name: Build and Publish Runner Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-act-micro:
    name: Build act-micro runner image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push act-micro
        uses: docker/build-push-action@v5
        with:
          context: .
          file: micro/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/act-micro:latest
            ghcr.io/${{ github.repository_owner }}/act-micro:22.04

  build-dind-runner:
    name: Build dind-runner-cache image
    runs-on: ubuntu-latest
    needs: build-act-micro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push dind-runner-cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dind/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/dind-runner-cache:latest

  # Independent of the two runner images: this one serves the cache warmer.
  # arm64 ONLY, unlike the siblings: warm/Dockerfile pins the yq and mc
  # arm64 tarballs by checksum, so an amd64 build would fail its
  # sha256sum -c. The cluster is arm64-only; add a per-arch stage here if
  # amd64 nodes ever join.
  build-act-warmer:
    name: Build act-warmer image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push act-warmer
        uses: docker/build-push-action@v5
        with:
          context: .
          file: warm/Dockerfile
          platforms: linux/arm64
          push: true
          # The DaemonSet pins an immutable tag (the pod cache would never
          # see an update from a :latest-only tag), so the sha tag is
          # mandatory, not a convenience.
          tags: |
            ghcr.io/${{ github.repository_owner }}/act-warmer:latest
            ghcr.io/${{ github.repository_owner }}/act-warmer:${{ github.sha }}
